<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#ece9dc"/><rect x="677" y="100" width="210" height="320" rx="20" fill="#fffdf6" transform="rotate(8 780 260)"/><path d="M725 195h110m-110 45h110m-110 45h65" stroke="#a9c0ab" stroke-width="10" stroke-linecap="round"/><text x="64" y="95" fill="#165b49" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">BEFORE YOUR TURN</text><text x="64" y="205" fill="#183c32" font-family="Arial,sans-serif" font-size="51" font-weight="bold">A smoother visit</text><text x="64" y="268" fill="#183c32" font-family="Arial,sans-serif" font-size="51" font-weight="bold">starts with preparation.</text><text x="64" y="350" fill="#53695b" font-family="Arial,sans-serif" font-size="23">Have your valid ID and required documents ready.</text><text x="64" y="395" fill="#53695b" font-family="Arial,sans-serif" font-size="23">Watch your number. Proceed when called.</text><text x="64" y="475" fill="#165b49" font-family="Arial,sans-serif" font-size="18">Ask PESO staff to confirm the requirements for your program.</text></svg>
