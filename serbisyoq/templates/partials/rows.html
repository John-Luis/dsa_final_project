{% for r in rows %}<tr><td><strong>{{ r.ticket }}</strong></td><td>{{ r.name }}</td><td class="concern-cell" title="{{ r.concern }}">{{ r.concern or '—' }}</td><td>{{ r.created_at|clock }}</td><td>{{ r.program_name }}</td><td><span class="badge status-{{ r.status|lower|replace(' ','-') }}">{{ r.status }}</span></td><td><a class="text-link" href="{{ url_for('detail',key=r.id) }}">View →</a></td></tr>{% else %}<tr><td colspan="7" class="empty">No matching requests. Try another date or invite an applicant to join the queue.</td></tr>{% endfor %}
