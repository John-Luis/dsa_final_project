{% for c in counters %}<article class="panel counter-card"><div class="card-top"><span class="eyebrow">COUNTER {{ c.id }}</span><span class="pill">{{ c.status or 'Available' }}</span></div><h3>{{ c.name }}</h3><strong class="counter-ticket">{{ c.ticket or '—' }}</strong>{% if c.request_id %}<a class="text-link" href="{{ url_for('detail',key=c.request_id) }}">Manage transaction →</a>{% else %}<form method="post" action="{{ url_for('call',counter=c.id) }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="button full">Call next <span>→</span></button></form>{% endif %}</article>{% endfor %}
